# Infrastructure for the AI Layered Design Generator (IMPLEMENTATION_PLAN §0.7, §0.8).
# Only stateful services live here; the app runs on the host for fast iteration.
#   docker compose -f infra/docker-compose.yml up -d

name: layered-design

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: design
      POSTGRES_PASSWORD: design
      POSTGRES_DB: design
      # Template retrieval is read-heavy and tiny; keep it all in memory.
      POSTGRES_INITDB_ARGS: "-c shared_buffers=256MB"
    ports: ["5442:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U design -d design"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # appendonly keeps queued jobs across a restart; progress pub/sub is ephemeral.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6380:6379"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9011"
    environment:
      MINIO_ROOT_USER: designminio
      MINIO_ROOT_PASSWORD: designminio
    ports:
      - "9010:9000"   # S3 API
      - "9011:9011"   # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the bucket on first boot so the app never has to be root on MinIO.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 designminio designminio &&
      mc mb --ignore-existing local/design-assets &&
      mc anonymous set download local/design-assets/public &&
      echo 'bucket ready'
      "

volumes:
  pgdata:
  redisdata:
  miniodata:

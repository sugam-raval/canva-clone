# The icon library: small line icons Lido draws as DrawLayer strokes — beside contact
# lines (`pairs_with`, placed by app/lido_create/decorate.py) and as the glyph inside a
# solid list bullet (`bullet: true`: the tick in check_circle, the chevron in
# arrow_circle — app/lido_create/lists.py). Clean, exact strokes.
#
# Every path is drawn as STROKES (never filled) in a 24 x 24 box — the same grid Lucide
# icons use, so any Lucide/Tabler-style stroke icon can be pasted in as is.
#
# To add one, copy an entry:
#   name:       short_snake_case, unique
#   themes:     words for what it marks (contact, hours, price, delivery…)
#   source:     hand (drawn here) | lucide:<icon> (written by scripts/build_doodles.py,
#               which refreshes those entries and never touches hand ones)
#   pairs_with: (optional) the text types it sits beside: website, phone, email, address
#   bullet:     (optional) true = a glyph drawn inside a solid list bullet
#   path:       SVG path data in the 24 x 24 box (M L H V C S Q T A Z; absolute or
#               relative).
# Then check it and look at it: `make lido-doodles` (loads, validates, draws a sheet).
# Lucide icons are ISC-licensed: see icons.LICENSE.md.


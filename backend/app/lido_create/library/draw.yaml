# DRAW — hand-drawn marker strokes (underlines, loops, arrows)
#
# Drawn by draw.py (a wobbly path per preset); this is the menu.
#
# One line per item:   name: "what it is and when to use it (the AI reads this)"
#   REMOVE an item  -> comment its line out (put # in front). The AI can then never use
#                      it: it disappears from the AI's instructions, the plan and the
#                      reply schema. Uncomment to bring it back.
#   ADD an item     -> needs a drawing branch for the new name in draw.py `draw_path`.
#
# Check after editing: `make test` (or restart the backend — an unknown name stops it
# with a message saying what is wrong).

underline: "one loose marker stroke under a word or headline"
double_underline: "two quick strokes under a word"
circle: "a loose hand-drawn loop around a price, badge or word"
arrow: "a curved arrow pointing from one corner of the box to the other"
squiggle: "a wavy line: divider or playful accent"
zigzag: "a sharp zigzag accent"
sparkle: "three short lines bursting out, for emphasis next to a word"
check: "a hand-drawn tick"
